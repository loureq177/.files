# GitHub Dark Theme for Yazi File Manager

[mgr]
cwd = { fg = "#58a6ff", bold = true }
syntect_theme = "/home/mlorenc/.config/yazi/github-dark.tmTheme"

# Find
find_keyword  = { fg = "#3fb950", bold = true, italic = true }
find_position = { fg = "#bc8cff", bg = "reset", bold = true }

# Symlink
symlink_target = { fg = "#8b949e", italic = true }

# Marker
marker_copied   = { fg = "#3fb950", bg = "#3fb950" }
marker_cut      = { fg = "#f85149", bg = "#f85149" }
marker_marked   = { fg = "#58a6ff", bg = "#58a6ff" }
marker_selected = { fg = "#d29922", bg = "#d29922" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#0d1117", bg = "#3fb950", bold = true }
count_cut      = { fg = "#0d1117", bg = "#f85149", bold = true }
count_selected = { fg = "#0d1117", bg = "#d29922", bold = true }

# Border
border_symbol = "│"
border_style  = { fg = "#30363d" }

[mode]
normal_main = { fg = "#0d1117", bg = "#58a6ff", bold = true }
normal_alt  = { fg = "#58a6ff", bg = "#161b22" }

select_main = { fg = "#0d1117", bg = "#3fb950", bold = true }
select_alt  = { fg = "#3fb950", bg = "#161b22" }

unset_main  = { fg = "#0d1117", bg = "#f85149", bold = true }
unset_alt   = { fg = "#f85149", bg = "#161b22" }

[indicator]
parent  = { fg = "#58a6ff", bg = "#21262d" }
current = { fg = "#ffffff", bg = "#21262d", bold = true }
preview = { underline = true }

[status]
perm_sep   = { fg = "#30363d" }
perm_type  = { fg = "#58a6ff" }
perm_read  = { fg = "#d29922" }
perm_write = { fg = "#f85149" }
perm_exec  = { fg = "#3fb950" }

progress_label  = { fg = "#c9d1d9", bold = true }
progress_normal = { fg = "#58a6ff", bg = "#161b22" }
progress_error  = { fg = "#f85149", bg = "#161b22" }

[tabs]
active   = { fg = "#0d1117", bg = "#58a6ff", bold = true }
inactive = { fg = "#8b949e", bg = "#161b22" }

[which]
border          = { fg = "#30363d" }
mask            = { bg = "#161b22" }
cand            = { fg = "#58a6ff" }
rest            = { fg = "#8b949e" }
desc            = { fg = "#c9d1d9" }
separator       = "  "
separator_style = { fg = "#30363d" }

[confirm]
border     = { fg = "#30363d" }
title      = { fg = "#58a6ff", bold = true }
btn_yes    = { fg = "#0d1117", bg = "#3fb950", bold = true }
btn_no     = { fg = "#c9d1d9", bg = "#21262d" }

[input]
border   = { fg = "#58a6ff" }
selected = { bg = "#21262d" }

[cmp]
border   = { fg = "#30363d" }
active   = { fg = "#58a6ff", bg = "#21262d", bold = true }

[tasks]
border  = { fg = "#30363d" }
title   = { fg = "#58a6ff", bold = true }
hovered = { bg = "#21262d" }

[help]
border  = { fg = "#30363d" }
chord   = { fg = "#58a6ff" }
hovered = { bg = "#21262d", bold = true }

[filetype]
rules = [
	# Media
	{ mime = "**/image/*", fg = "#bc8cff" },
	{ mime = "**/{audio,video}/*", fg = "#d29922" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f85149" },
	# Document
	{ mime = "**/application/{pdf,doc,docx,xls,xlsx,ppt,pptx}", fg = "#3fb950" },
	# Executable
	{ url = "*", is = "exec", fg = "#3fb950", bold = true },
	# Directory
	{ url = "*/", fg = "#58a6ff", bold = true },
]
