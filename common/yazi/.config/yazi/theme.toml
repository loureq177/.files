# GitHub Dark Theme for Yazi File Manager

[mgr]
cwd = { fg = "#58a6ff", bold = true }

# Hovered item
hovered = { bg = "#21262d", bold = true }

# Selected items
selected = { fg = "#58a6ff", bg = "#21262d", bold = true }

# Find item
find_keyword  = { fg = "#3fb950", bold = true, italic = true }
find_position = { fg = "#bc8cff", bg = "reset", bold = true }

# Marker
marker_copied  = { fg = "#3fb950", bg = "#3fb950" }
marker_cut     = { fg = "#f85149", bg = "#f85149" }
marker_marked  = { fg = "#58a6ff", bg = "#58a6ff" }
marker_selected = { fg = "#d29922", bg = "#d29922" }

# Tab
tab_active   = { fg = "#0d1117", bg = "#58a6ff", bold = true }
tab_inactive = { fg = "#8b949e", bg = "#161b22" }
tab_width    = 1

# Border
border_symbol = "│"
border_style  = { fg = "#30363d" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#30363d", bg = "#161b22" }

# Mode
mode_normal = { fg = "#0d1117", bg = "#58a6ff", bold = true }
mode_select = { fg = "#0d1117", bg = "#3fb950", bold = true }
mode_unset  = { fg = "#0d1117", bg = "#f85149", bold = true }

# Progress
progress_label  = { fg = "#c9d1d9", bold = true }
progress_normal = { fg = "#58a6ff", bg = "#161b22" }
progress_error  = { fg = "#f85149", bg = "#161b22" }

# Permissions
permissions_t = { fg = "#58a6ff" }
permissions_r = { fg = "#d29922" }
permissions_w = { fg = "#f85149" }
permissions_x = { fg = "#3fb950" }
permissions_s = { fg = "#8b949e" }

[input]
border   = { fg = "#58a6ff" }
title    = {}
value    = {}
selected = { bg = "#21262d" }

[pick]
border   = { fg = "#58a6ff" }
active   = { fg = "#bc8cff", bold = true }
inactive = {}

[confirm]
border  = { fg = "#58a6ff" }
title   = { fg = "#58a6ff", bold = true }
content = {}
list    = {}
btn_yes = { fg = "#0d1117", bg = "#3fb950", bold = true }
btn_no  = { fg = "#c9d1d9", bg = "#21262d" }

[completion]
border   = { fg = "#58a6ff" }
active   = { fg = "#58a6ff", bg = "#21262d" }
inactive = {}

[tasks]
border  = { fg = "#58a6ff" }
title   = { fg = "#58a6ff", bold = true }
hovered = { bg = "#21262d" }

[which]
mask            = { bg = "#161b22" }
cand            = { fg = "#58a6ff" }
rest            = { fg = "#8b949e" }
desc            = { fg = "#c9d1d9" }
separator       = "  "
separator_style = { fg = "#30363d" }

[help]
on      = { fg = "#58a6ff" }
run     = { fg = "#bc8cff" }
desc    = { fg = "#c9d1d9" }
hovered = { bg = "#21262d" }
footer  = { fg = "#161b22", bg = "#c9d1d9" }

[filetree]
segment_own = { fg = "#c9d1d9" }

[filetype]
rules = [
	# Media
	{ mime = "image/*", fg = "#bc8cff" },
	{ mime = "{audio,video}/*", fg = "#d29922" },
	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f85149" },
	# Documents
	{ mime = "application/{pdf,doc,docx,xls,xlsx,ppt,pptx}", fg = "#3fb950" },
	# Executables
	{ mime = "application/{x-executable,x-shellscript}", fg = "#3fb950", bold = true },
	# Directories
	{ is = "dir", fg = "#58a6ff", bold = true },
]
